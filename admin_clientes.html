            <th>Nombre</th><th>Apellido</th><th>Cédula</th>
            <th>Correo</th><th>Teléfono</th><th>Estado</th>

<script>
  const clientes = [
    { nombre: "Camilo", apellido: "Gómez", cedula: "1025548123", correo: "camilo@gmail.com", telefono: "3102222222", estado: "Activo" },
    { nombre: "Laura", apellido: "Martínez", cedula: "1025548999", correo: "laura@gmail.com", telefono: "3103333333", estado: "Inactivo" },
    { nombre: "Andrés", apellido: "Torres", cedula: "1025588999", correo: "andres@gmail.com", telefono: "3201111111", estado: "Activo" },
    { nombre: "Valentina", apellido: "Díaz", cedula: "1025599777", correo: "valentina@gmail.com", telefono: "3004444444", estado: "Activo" },
  ];

  // Crear fila de tabla
  function crearFila(cliente) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${cliente.nombre}</td>
      <td>${cliente.apellido}</td>
      <td>${cliente.cedula}</td>
      <td>${cliente.correo}</td>
      <td>${cliente.telefono}</td>
      <td>${cliente.estado}</td>
    `;
    return tr;
  }

  // Mostrar lista de clientes
  function mostrarClientes(lista) {
    const tbody = document.getElementById("tabla-clientes");
    tbody.innerHTML = "";
    lista.forEach(c => tbody.appendChild(crearFila(c)));
  }

  // Actualizar estadísticas con animación
  function actualizarEstadisticas(lista) {
    const activos = lista.filter(c => c.estado === "Activo").length;
    const historico = lista.length;
    animarValor("activos", parseInt(document.getElementById("activos").innerText), activos, 800);
    animarValor("historico", parseInt(document.getElementById("historico").innerText), historico, 800);
  }

  // Animación para los números
  function animarValor(id, inicio, fin, duracion) {
    const elemento = document.getElementById(id);
    let tiempoInicio = null;

    function paso(tiempo) {
      if (!tiempoInicio) tiempoInicio = tiempo;
      const progreso = Math.min((tiempo - tiempoInicio) / duracion, 1);
      elemento.innerText = Math.floor(progreso * (fin - inicio) + inicio);
      if (progreso < 1) window.requestAnimationFrame(paso);
    }

    window.requestAnimationFrame(paso);
  }

  // Buscar clientes
  function buscarCliente() {
    const texto = document.getElementById("buscar").value.toLowerCase();
    const filtrados = clientes.filter(c => 
      c.nombre.toLowerCase().includes(texto) ||
      c.apellido.toLowerCase().includes(texto)
    );
    mostrarClientes(filtrados);
    actualizarEstadisticas(filtrados);
  }

  // Cargar datos iniciales
  document.addEventListener("DOMContentLoaded", () => {
    mostrarClientes(clientes);
    actualizarEstadisticas(clientes);
  });

}
</script>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/Admin/AdminUsuarios.css">
  <title>Administrador - Clientes</title>
</head>
<body>

<div class="contenedor">
  <!-- Barra lateral -->
  <div class="barra-lateral">
    <img src="Imagenes/logos/Recurso 1.png" alt="Logo BarberTech" class="logo">

    <a href="admin_inicio.html" class="boton-menu">
      <img src="Imagenes/iconos/inicio.svg" alt=""> Inicio
    </a>

    <!-- Submenú Usuarios -->
    <div class="submenu">
      <input type="radio" id="usuarios-toggle" name="menu" checked>
      <label for="usuarios-toggle" class="boton-menu activado">
        <img src="Imagenes/iconos/Usuarios.png" alt=""> Usuarios
      </label>
      <div class="submenu-opciones">
        <a href="admin_usuarios_clientes.html" class="sub-item activado">Clientes</a>
        <a href="admin_usuarios_barberos.html" class="sub-item">Barberos</a>
      </div>
    </div>

    <!-- Submenú Servicios -->
    <div class="submenu">
      <input type="radio" id="servicios-toggle" name="menu">
      <label for="servicios-toggle" class="boton-menu">
        <img src="Imagenes/iconos/Servicios.png" alt=""> Servicios
      </label>
      <div class="submenu-opciones">
        <a href="admin_cortes.html" class="sub-item">Cortes</a>
        <a href="admin_productos.html" class="sub-item">Productos</a>
      </div>
    </div>

    <!-- Submenú Reportes -->
    <div class="submenu">
      <input type="radio" id="reportes-toggle" name="menu">
      <label for="reportes-toggle" class="boton-menu">
        <img src="Imagenes/iconos/reportes.png" alt=""> Reportes
      </label>
      <div class="submenu-opciones">
        <a href="admin_ventas.html" class="sub-item">Ventas</a>
        <a href="admin_asistencia.html" class="sub-item">Asistencia</a>
      </div>
    </div>

    <a class="cerrar-sesion" href="login.html">Cerrar sesión</a>
  </div>

  <!-- Contenido principal -->
  <div class="principal">
    <div class="encabezado">
      <h2>Usuario Clientes</h2>
      <img src="Imagenes/iconos/perfil.png" alt="Perfil" width="100">
    </div>

    <!-- Estadísticas -->
    <div class="estadisticas">
      <div class="card-estadistica"><span class="numero" id="activos">0</span><p>Clientes Activos</p></div>
      <div class="card-estadistica"><span class="numero" id="historico">0</span><p>Histórico de Clientes</p></div>
    </div>

    <!-- Buscador -->
    <div class="busqueda">
      <h3>Búsqueda de Clientes</h3>
      <div class="input-busqueda">
        <input type="text" id="buscar" placeholder="Buscar por nombre...">
        <button onclick="buscarCliente()">🔍</button>
      </div>
    </div>

    <!-- Tabla de clientes -->
    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr>
            <th>Nombre</th><th>Apellido</th><th>Cédula</th>
            <th>Correo</th><th>Teléfono</th><th>Estado</th>
          </tr>
        </thead>
        <tbody id="tabla-clientes"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  const clientes = [
    { nombre: "Camilo", apellido: "Gómez", cedula: "1025548123", correo: "camilo@gmail.com", telefono: "3102222222", estado: "Activo" },
    { nombre: "Laura", apellido: "Martínez", cedula: "1025548999", correo: "laura@gmail.com", telefono: "3103333333", estado: "Inactivo" },
  ];

  function crearFila(cliente) {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${cliente.nombre}</td>
      <td>${cliente.apellido}</td>
      <td>${cliente.cedula}</td>
      <td>${cliente.correo}</td>
      <td>${cliente.telefono}</td>
      <td>${cliente.estado}</td>
    `;
    return tr;
  }

  function mostrarClientes(lista) {
    const tbody = document.getElementById("tabla-clientes");
    tbody.innerHTML = "";
    lista.forEach(c => tbody.appendChild(crearFila(c)));
  }

  function buscarCliente() {
    const texto = document.getElementById("buscar").value.toLowerCase();
    const filtrados = clientes.filter(c => 
      c.nombre.toLowerCase().includes(texto) ||
      c.apellido.toLowerCase().includes(texto)
    );
    mostrarClientes(filtrados);
  }

  // Cargar datos iniciales
  document.addEventListener("DOMContentLoaded", () => {
    mostrarClientes(clientes);
    document.getElementById("activos").innerText = clientes.filter(c => c.estado === "Activo").length;
    document.getElementById("historico").innerText = clientes.length;
  });
</script>

</body>
</html>

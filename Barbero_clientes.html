<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberTech - Clientes</title>
  <link rel="stylesheet" href="css/Barbero/styles_barbero_clientes.css">
</head>
<body>
  <div class="contenedor">

    <!-- Sidebar -->
    <div class="barra-lateral">
      <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech" class="logo">

      <a href="./Barbero_inicio.html" class="boton-menu">
        <img src="./Imagenes/iconos/inicio.svg" alt=""> Inicio
      </a>
      <a href="./Barbero_Reservas.html" class="boton-menu">
        <img src="./Imagenes/iconos/reservas.png" alt=""> Reservas
      </a>
      <a href="./Barbero_clientes.html" class="boton-menu activado">
        <img src="./Imagenes/iconos/clientes.png" alt=""> Clientes
      </a>
      <a href="./Barbero_perfil.html" class="boton-menu">
        <img src="./Imagenes/iconos/Usuarios.png" alt=""> Perfil
      </a>

      <a class="cerrar-sesion" href="login.html">Cerrar sesión</a>
    </div>

    <!-- Main -->
    <div class="principal">
      <div class="encabezado">
        <h2>Buen día, Juan</h2>
        <img src="./Imagenes/iconos/perfil.png" alt="Perfil" width="100">
      </div>

      <!-- Clientes más recurrentes -->
      <div class="estadisticas">
        <div class="card-estadistica">
          <span class="numero" data-target="4">0</span>
          <p>Clientes recurrentes</p>
        </div>
      </div>

      <div class="tabla-contenedor">
        <h2 style="margin-bottom:15px;">Clientes más recurrentes</h2>
        <div class="clientes-grid">
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Tintura</strong><br> Ximena Zabala</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Corte</strong><br> Niok Torres</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Barba</strong><br> Carlos Alvarez</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Cejas</strong><br> Sara Davila</p>
          </div>
        </div>
        <button class="boton-accion">Ver más clientes</button>
      </div>
    </div>
  </div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const counters = document.querySelectorAll(".numero");

  counters.forEach(counter => {
    counter.innerText = "0";
    const updateCounter = () => {
      const target = +counter.getAttribute("data-target");
      const count = +counter.innerText;

      const increment = target / 100; 

      if (count < target) {
        counter.innerText = Math.ceil(count + increment);
        setTimeout(updateCounter, 100);
      } else {
        counter.innerText = target;
      }
    };

    updateCounter();
  });
});

// Ejemplo para botón Ver más clientes
const verMasBtn = document.querySelector(".boton-accion");

if (verMasBtn) {
  verMasBtn.addEventListener("click", () => {
    alert("Aquí se mostrarán más clientes recurrentes...");
  });
}

</script>
</body>
</html>

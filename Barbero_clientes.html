<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - BarberTech</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barbero_clientes.css">
  <script src="https://kit.fontawesome.com/a2e0e6ad5d.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech">
      </div>
      <nav>
        <a href="index.html" class="nav-item">🏠<i class="fas fa-home"></i> Inicio</a>
        <a href="reservas.html" class="nav-item">📅<i class="fas fa-book"></i> Reservas</a>
        <a href="clientes.html" class="nav-item active">🧑🏽‍💻<i class="fas fa-users"></i> Clientes</a>
        <a href="perfil.html" class="nav-item">👤<i class="fas fa-user"></i> Perfil</a>
      </nav>
      <button class="logout">Cerrar sesión</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <div>
          <h1>Hola, Felipe Nicolas</h1>
          <p>Luce siempre tu mejor versión</p>
        </div>
        <div class="profile">
          <img src="./Imagenes/iconos/perfil.png" alt="Perfil" class="profile-pic">
        </div>
      </header>

      <!-- Clientes más recurrentes -->
      <section class="card clientes-card">
        <h2>Clientes más recurrentes</h2>
        <div class="clientes-grid">
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Tintura</strong><br> Ximena Zabala</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Corte</strong><br> Niok Torres</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Barba</strong><br> Carlos Alavarez</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong>Cejas</strong><br> Sara Davila</p>
          </div>
          <div class="cliente">
            <img src="./Imagenes/iconos/perfil.png" alt="Cliente" class="cliente-pic">
            <p><strong></strong><br> </p>
          </div>
        </div>
        <button class="btn ver-mas">Ver más clientes</button>
      </section>
    </main>
  </div>
</body>
</html>

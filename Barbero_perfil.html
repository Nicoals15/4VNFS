<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - BarberTech</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barbero_perfil.css">
  <script src="https://kit.fontawesome.com/a2e0e6ad5d.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech">
      </div>
      <nav>
        <a href="./Barbero_inicio.html" class="nav-item">
          <span class="icon">🏠</span>
          <span>Inicio</span>
        </a>
        <a href="./Barbero_Reservas.html" class="nav-item">
          <span class="icon">📅</span>
          <span>Reservas</span>
        </a>
        <a href="./Barbero_clientes.html" class="nav-item">
          <span class="icon">🧑🏽‍💻</span>
          <span>Clientes</span>
        </a>
        <a href="./Barbero_perfil.html" class="nav-item active">
          <span class="icon">👤</span>
          <span>Perfil</span>
        </a>
      </nav>
      <button class="logout">Cerrar sesión</button>
    </aside>

    <!-- Main -->
    <main class="main">
      <header class="header">
        <div>
          <h1>Hola, Felipe Nicolas</h1>
          <p>Luce siempre tu mejor versión</p>
        </div>
        <div class="profile">
          <img src="./Imagenes/iconos/perfil.png" alt="Perfil" class="profile-pic">
        </div>
      </header>

      <!-- Contenido perfil -->
      <section class="profile-update-section">
        <div class="profile-update-card">
          <h2>Actualización de datos</h2>
          <form class="update-form">
            <div class="form-group">
              <label for="phone">Teléfono</label>
              <input type="text" id="phone" name="phone" placeholder="Ingrese su teléfono">
            </div>
            <div class="form-group">
              <label for="email">Correo</label>
              <input type="email" id="email" name="email" placeholder="Ingrese su correo">
            </div>
            <div class="form-group">
              <label for="password">Contraseña</label>
              <input type="password" id="password" name="password" placeholder="Ingrese nueva contraseña">
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirmar contraseña</label>
              <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita la contraseña">
            </div>
            <div class="form-buttons">
              <button type="button" class="cancel-button">Cancelar</button>
              <button type="submit" class="confirm-button">Confirmar</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

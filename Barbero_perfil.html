<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perfil - BarberTech</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barbero_perfil.css">
</head>
<body>
  <div class="contenedor">

    <!-- Sidebar -->
    <div class="barra-lateral">
      <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech" class="logo">

      <a href="./Barbero_inicio.html" class="boton-menu">
        <img src="./Imagenes/iconos/inicio.svg" alt=""> Inicio
      </a>
      <a href="./Barbero_Reservas.html" class="boton-menu">
        <img src="./Imagenes/iconos/reservas.png" alt=""> Reservas
      </a>
      <a href="./Barbero_clientes.html" class="boton-menu">
        <img src="./Imagenes/iconos/clientes.png" alt=""> Clientes
      </a>
      <a href="./Barbero_perfil.html" class="boton-menu activado">
        <img src="./Imagenes/iconos/Usuarios.png" alt=""> Perfil
      </a>

      <a class="cerrar-sesion" href="login.html">Cerrar sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="principal">
      <!-- Encabezado -->
      <div class="encabezado">
        <h2>Buen día, Juan</h2>
        <img src="./Imagenes/iconos/perfil.png" alt="Perfil" width="100">
      </div>

      <!-- Sección perfil -->
      <div class="tarjeta perfil">
        <h3>Actualización de datos</h3>
        <form class="update-form">
          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input type="text" id="phone" name="phone" placeholder="Ingrese su teléfono">
          </div>
          <div class="form-group">
            <label for="email">Correo</label>
            <input type="email" id="email" name="email" placeholder="Ingrese su correo">
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Ingrese nueva contraseña">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar contraseña</label>
            <input type="password" id="confirm-password" name="confirm-password" placeholder="Repita la contraseña">
          </div>
          <div class="form-buttons">
            <button type="button" class="cancel-button">Cancelar</button>
            <button type="submit" class="confirm-button">Confirmar</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>

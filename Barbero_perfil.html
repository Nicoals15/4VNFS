<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes - BarberTech</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barbero_perfil.css">
  <script src="https://kit.fontawesome.com/a2e0e6ad5d.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard">

  <div class="dashboard-content perfil">
    <h3>Actualización de datos</h3>
    <form class="perfil-form">
      <label>Teléfono</label>
      <input type="text" placeholder="Ingrese su teléfono">

      <label>Correo</label>
      <input type="email" placeholder="Ingrese su correo">

      <label>Contraseña</label>
      <input type="password" placeholder="Ingrese nueva contraseña">

      <label>Confirmar contraseña</label>
      <input type="password" placeholder="Repita la contraseña">

      <div class="perfil-buttons">
        <button type="button" class="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn-confirmar">Confirmar</button>
      </div>
    </form>
  </div>
</div>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberTech - Dashboard Barbero</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barber.css">
</head>
<body>
  <div class="contenedor">

    <!-- Sidebar -->
    <div class="barra-lateral">
      <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech" class="logo">

      <a href="./Barbero_inicio.html" class="boton-menu activado">
        <img src="./Imagenes/iconos/inicio.svg" alt=""> Inicio
      </a>
      <a href="./Barbero_Reservas.html" class="boton-menu">
        <img src="./Imagenes/iconos/reservas.png" alt=""> Reservas
      </a>
      <a href="./Barbero_clientes.html" class="boton-menu">
        <img src="./Imagenes/iconos/clientes.png" alt=""> Clientes
      </a>
      <a href="./Barbero_perfil.html" class="boton-menu">
        <img src="./Imagenes/iconos/Usuarios.png" alt=""> Perfil
      </a>

      <a class="cerrar-sesion" href="login.html">Cerrar sesión</a>
    </div>

    <!-- Contenido principal -->
    <div class="principal">
      <!-- Encabezado -->
      <div class="encabezado">
        <h2>Buen día, Juan</h2>
        <img src="./Imagenes/iconos/perfil.png" alt="Perfil" width="100">
      </div>

      <!-- Estadísticas principales -->
      <div class="estadisticas">
        <div class="caja-estadistica">
          <h3>Próxima cita</h3>
          <p><strong>María López</strong> <br> 2:00 pm <br> <span style="color:#ff9800;">Pendiente</span></p>
        </div>
        <div class="caja-estadistica">
          <h3>Siguiente cita</h3>
          <p><strong>Pedro Ruiz</strong> <br> 11:30 am <br> <span style="color:#4caf50;">Realizada</span></p>
        </div>
      </div>

      <!-- Tarjetas de información -->
      <div class="tarjeta">
        <h3>Porcentaje de reseñas</h3>
        <div class="rating">
          <span style="font-size:25px; font-weight:bold;">4.8</span>
          <span class="stars">★★★★★</span>
        </div>
      </div>

      <div class="tarjeta">
        <h3>Total de citas en el mes</h3>
        <p style="font-size:20px; font-weight:bold; text-align: center;">22</p>
        <p>Citas agendadas</p>
      </div>

      <div class="tarjeta">
        <h3>Depósito total</h3>
        <p style="font-size:20px; font-weight:bold;">$450.000</p>
      </div>

      <div class="tarjeta">
        <h3>Clientes</h3>
        <p style="font-size:20px; font-weight:bold;">45</p>
      </div>
    </div>
  </div>
</body>
</html>

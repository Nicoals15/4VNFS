<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberTech Dashboard</title>
  <link rel="stylesheet" href="./css/Barbero/styles_barber.css">
  <!-- Si quieres iconos más pro, activa Font Awesome -->
  <script src="https://kit.fontawesome.com/a2e0e6ad5d.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="dashboard">

    <!-- Sidebar -->
    <aside class="sidebar">
  <div class="logo">
    <img src="./Imagenes/logos/Recurso 1.png" alt="Logo BarberTech">
  </div>

  <nav>
    <a href="./admin_inicio.html" class="nav-item active">
      <span class="icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="./Barbero_Reservas.html" class="nav-item">
      <span class="icon">📅</span>
      <span>Reservas</span>
    </a>
    <a href="./Barbero_clientes.html" class="nav-item">
      <span class="icon">🧑🏽‍💻</span>
      <span>Clientes</span>
    </a>
    <a href="./Barbero_clientes.html" class="nav-item">
      <span class="icon">👤</span>
      <span>Perfil</span>
    </a>
  </nav>

  <button class="logout">Cerrar sesión</button>
</aside>


    <!-- Contenido principal -->
    <main class="main">
      <header class="header">
        <div>
          <h1>Buenos días, Juan</h1>
          <p>Gestione su agenda hoy</p>
        </div>
        <div class="profile">
          <img src="./Imagenes/iconos/perfil.png" alt="Perfil" class="profile-pic">
        </div>
      </header>

      <!-- Próxima cita + reseñas + total citas -->
      <section class="top-grid">
        <!-- Próxima cita -->
        <div class="card">
          <h2>Próxima cita</h2>
          <ul class="appointments">
            <li>
              <div>
                <strong>María López</strong>
                <time>2:00 pm</time>
              </div>
              <span class="badge pending">Pendiente</span>
              <button class="btn-icon"><i class="fas fa-ellipsis-h"></i></button>
            </li>
            <li>
              <div>
                <strong>Pedro Ruiz</strong>
                <time>11:30 am</time>
              </div>
              <span class="badge done">Realizada</span>
              <button class="btn-icon"><i class="fas fa-ellipsis-h"></i></button>
            </li>
          </ul>
        </div>

        <!-- Reseñas y total citas -->
        <div class="side-cards">
          <div class="card">
            <h3>Porcentaje de reseñas</h3>
            <div class="rating">
              <span>4.8</span>
              <span class="stars">★★★★★</span>
            </div>
          </div>
          <div class="card">
            <h3>Total de citas en el mes</h3>
            <div class="big">22</div>
            <p>Citas agendadas</p>
          </div>
        </div>
      </section>

      <!-- KPIs -->
      <section class="kpis">
        <div class="card kpi">
          <h3>Depósito total</h3>
          <div class="value">$450.000</div>
        </div>
        <div class="card kpi">
          <h3>Clientes</h3>
          <div class="value">45</div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/Cliente/estilos.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-container">
                <img src="Imagenes/logos/Recurso 1.png"  class="logo">
            </div>
            <nav class="navigation">
                <ul>
                    <li class="active">
                        <a href="index_cliente.html">
                            <span class="icon">🏠</span>
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a href="reserva_cliente.html">
                            <span class="Reserva_cliente">📅</span>
                            Reservas
                        </a>
                    </li>
                    <li>
                        <a href="perfil_cliente.html">
                            <span class="icon">👤</span>
                            Perfil
                        </a>
                    </li>
                </ul>
            </nav>
            <button class="logout-button">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-text">
                    <h1>Hola, Juan</h1>
                    <p>Luce siempre tu mejor versión</p>
                </div>
                <div class="header-profile">
                    <div class="profile-icon">👤</div>
                </div>
            </header>

            <section class="next-appointment">
                <h2>Próxima cita</h2>
                <div class="appointment-card">
                    <div class="appointment-details">
                        <p>10 de septiembre 2025</p>
                        <p>10:00 am</p>
                        <p>Asesoría de imagen, Corte de pelo</p>
                    </div>
                    <div class="barber-info">
                        <div class="barber-icon">👤</div>
                        <p>Barbero</p>  
                        <p>Carlos Alvarez</p>
                    </div>
                    <button class="details-button">Ver más detalles</button>
                </div>
            </section>
            
            <section class="history">
                <h2>Historial</h2>
                <div class="history-content">
                    <div class="history-table">
                        <table>
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Servicio</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr>
                                    <td>31/08/2025</td>
                                    <td>Corte de pelo</td>
                                </tr>
                                <tr>
                                    <td>25/08/2025</td>
                                    <td>Corte de barba</td>
                                </tr>
                                <tr>
                                    <td>10/08/2025</td>
                                    <td>Corte de cejas</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                    <div class="history-chart">
                        <img src="https://via.placeholder.com/150x150.png?text=Chart" alt="Historial de servicios">
                    </div>
                </div>
            </section>
        </main>
    </div>
</body>

</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BarberTech Dashboard</title>
    <link rel="stylesheet" href="css/Cliente/estilos.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-container">
                <img src="Imagenes/logos/Recurso 1.png"  class="logo">
            </div>
            <nav class="navigation">
                <ul>
                    <li>
                        <a href="index_cliente.html">
                            <span class="icon">🏠</span>
                            Inicio
                        </a>
                    </li>
                    <li>
                        <a href="reserva_cliente.html">
                            <span class="icon">📅</span>
                            Reservas
                        </a>
                    </li>
                    <li class="active">
                        <a href="perfil_cliente.html">
                            <span class="icon">👤</span>
                            Perfil
                        </a>
                    </li>
                </ul>
            </nav>
            <button class="logout-button">Cerrar sesión</button>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-text">
                    <h1>Hola, Felipe Nicolas</h1>
                    <p>Luce siempre tu mejor versión</p>
                </div>
                <div class="header-profile">
                    <div class="profile-icon">👤</div>
                    <span class="edit-link">Editar</span>
                </div>
            </header>

            <section class="profile-update-section">
                <div class="profile-update-card">
                    <h2>Actualización de datos</h2>
                    <form class="update-form">
                        <div class="form-group">
                            <label for="phone">Teléfono</label>
                            <input type="text" id="phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="email">Correo</label>
                            <input type="email" id="email" name="email">
                        </div>
                        <div class="form-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password">
                        </div>
                        <div class="form-group">
                            <label for="confirm-password">Confirmar contraseña</label>
                            <input type="password" id="confirm-password" name="confirm-password">
                        </div>
                        <div class="form-buttons">
                            <button type="button" class="cancel-button">Cancelar</button>
                            <button type="submit" class="confirm-button">Confirmar</button>
                        </div>
                    </form>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
